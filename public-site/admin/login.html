
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Sakthi Dental Clinic</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #183047;
    }
    .login-card {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 35px #18304718;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #637386; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; font-weight: 600; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd6e0;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #087f8c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    #loginMessage { margin-top: 15px; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Admin Login</h1>
    <p>Sakthi Dental Clinic appointment management</p>

    <form id="loginForm">
      <label for="email">Admin email</label>
      <input id="email" type="email" required autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" required
        autocomplete="current-password">

      <button id="loginButton" type="submit">Sign In</button>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
